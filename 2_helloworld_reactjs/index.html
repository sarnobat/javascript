<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>React Hello World</title>
    <!-- Load React and ReactDOM from CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <!-- Load Babel to compile JSX in the browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body>
    <div id="root"></div>

<!-- <img src="./logo.svg"  className="App-logo" alt="logo" /> -->
        <!--<img src={logo} className="App-logo" alt="logo" />-->

    <!-- Your React code goes here -->
    <script type="text/babel">
//import './App.css';
//import logo from './logo.svg';

      function Hello() {
        return (<><h1>Hello World</h1>Note you can't use imports. React needs a bundler on the server. This sounds a lot like templating to me. What's so great about reactJS again?</>);
      }


      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<Hello />);
    </script>
  </body>
</html>
